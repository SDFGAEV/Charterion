name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $($package.version)"
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Full release verification and packaging
        run: npm run release
      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.zip
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: charterion-release-${{ github.ref_name }}
          path: release/**
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" release/*.zip release/*.sha256 release/readme-i18n-evidence.json --title "Charterion $env:GITHUB_REF_NAME" --generate-notes
