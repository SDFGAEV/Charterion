name: Bug report
description: Report a reproducible Charterion defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Charterion version/commit, Windows version, browser, Node version
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Remove secrets, cookies, tokens, and private repository details before posting.