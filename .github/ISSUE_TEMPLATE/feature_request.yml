name: Feature request
description: Propose a focused Charterion improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering problem or workflow limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the desired behavior, not just an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Authority and scope implications
      description: Note any effect on permissions, capabilities, browser automation, persistence, Git authority, or project scope.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives, tradeoffs, or prior art.